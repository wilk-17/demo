<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 450px;
            margin: 0 auto;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h2 {
            color: #667eea;
            font-weight: 700;
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: 600;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .alert {
            border-radius: 10px;
        }
        .user-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        .permission-badge {
            font-size: 0.75rem;
            margin: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card">
            <div class="login-header">
                <h2>🔐 Iniciar Sesión</h2>
                <p class="text-muted">Sistema de Gestión Empresarial</p>
            </div>

            <div id="loginForm">
                <div class="alert alert-info">
                    <strong>Usuarios de prueba:</strong><br>
                    • Usuario: <code>admin</code> / Contraseña: <code>admin123</code><br>
                    • O usa tus credenciales registradas
                </div>

                <div id="errorAlert" class="alert alert-danger d-none"></div>

                <form id="loginFormElement">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-login w-100">
                        Iniciar Sesión
                    </button>
                </form>
            </div>

            <div id="userInfo" class="user-info d-none">
                <h5>✅ Sesión Iniciada</h5>
                <div id="userDetails"></div>
                <button class="btn btn-danger mt-3 w-100" onclick="logout()">Cerrar Sesión</button>
                <a href="/" class="btn btn-success mt-2 w-100">Ir al Sistema de Gestión</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Verificar si ya hay sesión
        const token = localStorage.getItem('token');
        if (token) {
            checkCurrentUser();
        }

        document.getElementById('loginFormElement').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');
            
            errorAlert.classList.add('d-none');
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    
                    // Verificar que sea ADMINISTRADOR
                    if (data.roleName !== 'ADMIN') {
                        errorAlert.textContent = '⚠️ Acceso denegado. Solo los administradores pueden acceder a este sistema.';
                        errorAlert.classList.remove('d-none');
                        return;
                    }
                    
                    // Guardar token y datos del usuario
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('role', data.roleName);
                    
                    // Redirigir automáticamente al dashboard
                    window.location.href = '/index';
                } else {
                    const error = await response.text();
                    errorAlert.textContent = 'Error: ' + (error || 'Credenciales incorrectas');
                    errorAlert.classList.remove('d-none');
                }
            } catch (error) {
                errorAlert.textContent = 'Error de conexión: ' + error.message;
                errorAlert.classList.remove('d-none');
            }
        });

        async function checkCurrentUser() {
            try {
                const response = await fetch('/api/auth/me', {
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    // Si ya tiene sesión válida, redirigir al dashboard
                    if (data.roleName === 'ADMIN') {
                        window.location.href = '/index';
                    } else {
                        logout();
                        const errorAlert = document.getElementById('errorAlert');
                        errorAlert.textContent = '⚠️ Acceso denegado. Solo los administradores pueden acceder a este sistema.';
                        errorAlert.classList.remove('d-none');
                    }
                } else {
                    logout();
                }
            } catch (error) {
                console.error('Error checking user:', error);
                logout();
            }
        }

        function showUserInfo(data) {
            document.getElementById('loginForm').classList.add('d-none');
            document.getElementById('userInfo').classList.remove('d-none');
            
            let permissionsHtml = '';
            if (data.permissions && data.permissions.length > 0) {
                permissionsHtml = '<div class="mt-3"><strong>Permisos:</strong><br>';
                data.permissions.forEach(permission => {
                    permissionsHtml += `<span class="badge bg-info permission-badge">${permission}</span> `;
                });
                permissionsHtml += '</div>';
            }
            
            document.getElementById('userDetails').innerHTML = `
                <p><strong>Usuario:</strong> ${data.username}</p>
                <p><strong>Rol:</strong> <span class="badge bg-primary">${data.roleName}</span></p>
                <p><strong>Token JWT:</strong> <small class="text-muted">${localStorage.getItem('token').substring(0, 50)}...</small></p>
                ${permissionsHtml}
            `;
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            localStorage.removeItem('role');
            
            document.getElementById('loginForm').classList.remove('d-none');
            document.getElementById('userInfo').classList.add('d-none');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>
